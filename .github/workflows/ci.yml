name: CI

on:
  pull_request:
  push:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uvx ruff check --isolated --select E9,F src

      - name: Smoke test (imports and CLI entrypoints)
        run: |
          uv run python -c "import onsen_scrawler, onsen_scrawler.mcp_server, onsen_scrawler.storage_pg"
          uv run onsen-scrawler --help

      # Add real tests under tests/ and they run here automatically
      - name: Pytest
        run: |
          if [ -d tests ]; then
            uv run --with pytest pytest -q
          else
            echo "No tests/ directory yet, skipping"
          fi

  docker:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      # PRs: build only. Pushes to main: build and push.
      - name: Build (and push on main)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Image names must be lowercase; reuse the (lowercased) first tag from the metadata action
      - name: Pick image ref to scan
        id: first_tag
        run: echo "ref=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.first_tag.outputs.ref }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"   # report only; set to "1" to fail the build

  # Dev CD: point the dev Argo CD app at the image we just pushed. Argo CD only
  # watches git, so the tag bump is what triggers the deploy. Runs after the push
  # succeeded, so the tag always exists in the registry. Commits made with
  # GITHUB_TOKEN do not start new workflow runs, so this cannot loop.
  update-dev-tag:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set image tag in values-dev.yaml
        run: |
          sed -i "s|^  tag: .*|  tag: sha-${{ github.sha }}|" charts/onsen-scrawler/values-dev.yaml
          git diff --stat

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/onsen-scrawler/values-dev.yaml
          git commit -m "ci: deploy sha-${{ github.sha }} to dev" || exit 0
          git pull --rebase origin develop
          git push origin develop
