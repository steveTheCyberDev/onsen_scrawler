apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onsen-scrawler
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/steveTheCyberDev/onsen_scrawler.git
    targetRevision: main
    path: charts/onsen-scrawler
    helm:
      releaseName: onsen-scrawler
  destination:
    server: https://kubernetes.default.svc
    namespace: onsen
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
