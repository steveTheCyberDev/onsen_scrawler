[project]
name = "onsen-scrawler"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "steveTheCyberDev", email = "steve.thecyberdev@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "charset-normalizer>=3.3",
    "psycopg[binary]>=3.1",
    "mcp>=1.2",
]

[project.scripts]
onsen-scrawler = "onsen_scrawler:main"
onsen-scrawler-mcp = "onsen_scrawler.mcp_server:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"
